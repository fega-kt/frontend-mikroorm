server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # File build có hash trong tên (vite → /assets): nội dung không bao giờ đổi nên cache vĩnh viễn.
    # Thiếu file thì trả 404 chứ không trả index.html, để client bắt lỗi vite:preloadError và tải lại trang sau khi deploy
    location ^~ /assets/ {
        # mime.types của nginx không có .mjs (vd worker của pdf.js): phải trả JavaScript, nếu không trình duyệt chặn module script
        types {
            application/javascript js mjs;
            text/css css;
            image/svg+xml svg;
            image/png png;
            image/jpeg jpg jpeg;
            image/gif gif;
            image/webp webp;
            image/avif avif;
            font/woff woff;
            font/woff2 woff2;
            font/ttf ttf;
            application/vnd.ms-fontobject eot;
            application/wasm wasm;
            application/json json;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # File tĩnh ngoài /assets (favicon, logo, og-image…) không có hash: cache ngắn và kiểm tra lại để đổi file là thấy ngay
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        try_files $uri =404;
    }

    # index.html, version.json, manifest.json…: luôn hỏi lại server để nhận bản deploy mới
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" type="image/svg+xml" href="/logo.svg" />
	<link rel="icon" href="/favicon.ico" sizes="48x48" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="#000000" />
	<meta name="description" content="%VITE_GLOB_APP_DESCRIPTION%" />
	<!-- Open Graph / Twitter: preview khi share link (Zalo, Facebook, Messenger, Slack…) — crawler không chạy JS nên phải để tĩnh, ảnh phải là URL tuyệt đối -->
	<meta property="og:type" content="website" />
	<meta property="og:site_name" content="%VITE_GLOB_APP_TITLE%" />
	<meta property="og:title" content="%VITE_GLOB_APP_TITLE%" />
	<meta property="og:description" content="%VITE_GLOB_APP_DESCRIPTION%" />
	<meta property="og:url" content="%VITE_GLOB_APP_URL%/" />
	<meta property="og:image" content="%VITE_GLOB_APP_OG_IMAGE_URL%" />
	<meta property="og:image:width" content="1200" />
	<meta property="og:image:height" content="630" />
	<meta property="og:image:alt" content="%VITE_GLOB_APP_TITLE%" />
	<meta property="og:locale" content="vi_VN" />
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:title" content="%VITE_GLOB_APP_TITLE%" />
	<meta name="twitter:description" content="%VITE_GLOB_APP_DESCRIPTION%" />
	<meta name="twitter:image" content="%VITE_GLOB_APP_OG_IMAGE_URL%" />
	<link rel="apple-touch-icon" href="/logo192.png" />
	<!--
			manifest.json provides metadata used when your web app is installed on a
			user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
		-->
	<link rel="manifest" href="/manifest.json" />
	<!-- Inject the VITE_GLOB_APP_TITLE variable by Vite, configured in the .env file -->
	<title>%VITE_GLOB_APP_TITLE%</title>
</head>

<body>
	<noscript>You need to enable JavaScript to run this app.</noscript>
	<div id="root"></div>
	<script type="module" src="/src/index.tsx"></script>
</body>

</html>

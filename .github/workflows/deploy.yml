name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Tests & type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Test cần cùng biến môi trường với bản build (vd: VITE_APP_NAMESPACE); .env không nằm trong git nên lấy từ Vault
      - name: Fetch secrets from Vault
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          VAULT_AUTH_METHOD: ${{ vars.VAULT_AUTH_METHOD }}
        run: pnpm exec vault-start ${{ vars.VAULT_SECRET_PATH }} --write-env

      - name: Run tests
        run: pnpm test --run

  build-and-push:
    name: Build & Push Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch secrets from Vault
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          VAULT_AUTH_METHOD: ${{ vars.VAULT_AUTH_METHOD }}
        run: pnpm exec vault-start ${{ vars.VAULT_SECRET_PATH }} --write-env

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      # Thông tin build hiển thị ở window.BUILD_INFO — đọc từ git (dùng được cả khi chạy tay workflow_dispatch)
      - name: Collect build info
        id: build_info
        run: |
          subject="$(git log -1 --format='%s')"
          # Commit merge PR: dòng đầu là "Merge pull request #..." → lấy tiêu đề PR ở dòng nội dung đầu tiên
          if [[ "$subject" == Merge\ pull\ request* ]]; then
            body_title="$(git log -1 --format='%b' | sed '/^[[:space:]]*$/d' | head -n 1)"
            subject="${body_title:-$subject}"
          fi
          {
            echo "author=$(git log -1 --format='%an')"
            echo "message=${subject}"
            echo "time=$(TZ=Asia/Ho_Chi_Minh date --iso-8601=seconds)"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            GIT_AUTHOR=${{ steps.build_info.outputs.author }}
            GIT_MESSAGE=${{ steps.build_info.outputs.message }}
            BUILD_TIME=${{ steps.build_info.outputs.time }}

  deploy:
    name: Deploy to server
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    # Hai lần deploy FE (vd merge 2 PR liền nhau) chạy lần lượt, không chồng lên nhau trên server
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config <<EOF
          Host ${{ secrets.SERVER_HOST }}
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
          EOF

      - name: Deploy
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          APP_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash <<ENDSSH
            # Dừng ngay khi login/pull/up lỗi, để job báo fail đúng thay vì chỉ lấy exit code của lệnh cuối
            set -e
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd ${{ secrets.SERVER_DEPLOY_PATH }}
            APP_IMAGE="$APP_IMAGE" docker compose -f docker-compose.yml pull
            APP_IMAGE="$APP_IMAGE" docker compose -f docker-compose.yml up -d --remove-orphans
            # Dọn image cũ của riêng FE (lọc theo label nguồn repo do metadata-action gắn) — không đụng image của BE.
            # Docker chỉ cho 1 lệnh prune chạy một lúc: FE và BE deploy cùng lúc thì lệnh sau lỗi "a prune operation is already running"
            # → xếp hàng qua file khoá dùng chung trên server; dọn image là phụ nên lỗi thì bỏ qua, không làm fail deploy
            flock -w 120 /tmp/zhizhu-docker-prune.lock \
              docker image prune -f --filter "label=org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              || echo "Skip image prune (another prune may be running)"
          ENDSSH
